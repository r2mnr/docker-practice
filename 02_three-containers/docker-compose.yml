version: '3.8'

services:
  #フロントエンド（案内人）：8000番ポートで待ち受け
  front-web:
    image: nginx:latest
    ports:
      - "8000:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html
      - ./default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - back-app

  #バックエンド（頭脳・厨房）：5000番ポートで待ち受け
  back-app:
    image: python:3.10-slim
    ports:
      - "5000:5000"
    volumes:
      - ./app.py:/app/app.py
    working_dir: /app
    command: sh -c "pip install flask flask-sqlalchemy mysql-connector-python && python app.py"
    depends_on:
      - db-store

  #データベース（倉庫）：★今回新しく追加する3つ目のコンテナ！
  db-store:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: aikio_password
      MYSQL_DATABASE: study_db
