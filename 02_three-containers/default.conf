server {
    listen 80;
    server_name localhost;

    # ① 「http://localhost/」にアクセスが来たら、マウントされた index.html を表示しろ
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # ② 画面から「/api/data」へ注文が来たら、裏で待っているPython（5000番）へこっそり転送しろ
    location /api/data {
        proxy_pass http://back-app:5000/api/data;
    }
}
